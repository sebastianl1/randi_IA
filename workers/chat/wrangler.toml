name = "randi-chat"
main = "src/index.ts"
compatibility_date = "2024-11-06"

# Disponible en https://<name>.<cuenta>.workers.dev con el deploy automático.
workers_dev = true

[vars]
FREE_DAILY_LIMIT = "40"

# Workers AI (plan gratuito). El binding "AI" se crea desde el dashboard
# (Workers AI -> Manage -> Bindings), con wrangler o por API.
[ai]
binding = "AI"