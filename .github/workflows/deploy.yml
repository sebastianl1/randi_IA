name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Instalar y construir la landing (Astro)
        run: |
          npm --prefix site ci --no-audit --no-fund
          node site/node_modules/astro/astro.js build --root site

      - name: Subir artefacto (site/dist)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist