name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          pip install ruff requests rich textual httpx

      - name: Bash - sintaxis y shellcheck
        run: |
          bash -n bin/randi
          bash -n install-ollama.sh
          bash -n bin/ollama-chat
          shellcheck -S error bin/randi install-ollama.sh bin/ollama-chat

      - name: Python - compilacion y lint
        run: |
          python3 -m py_compile web/server.py bin/lib/*.py bin/lib/randi_tui/*.py
          ruff check web/server.py bin/lib/*.py bin/lib/randi_tui/*.py

      - name: JS/TS - build web y landing (Astro + Tailwind)
        run: |
          npm --prefix web ci --no-audit --no-fund
          node web/node_modules/astro/astro.js build --root web
          npm --prefix site ci --no-audit --no-fund
          node site/node_modules/astro/astro.js build --root site

      - name: models.json valido y sin duplicados
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, 'bin/lib')
          from catalog import get_models
          d = json.load(open('web/models.json'))
          ids = [m['id'] for m in get_models()]
          assert len(ids) == len(set(ids)), 'IDs duplicados en el catalogo'
          for m in get_models():
              assert m.get('ctx'), f'falta ctx en {m[\"id\"]}'
              assert m.get('ram'), f'falta ram en {m[\"id\"]}'
          print(f'OK: {len(ids)} modelos unicos')
          "

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Node (para build de web)
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Build web (el servidor sirve web/dist)
        run: |
          npm --prefix web ci --no-audit --no-fund
          node web/node_modules/astro/astro.js build --root web

      - name: Ejecutar tests (pytest)
        run: |
          pip install pytest textual httpx requests rich
          python3 -m pytest tests/ -q
